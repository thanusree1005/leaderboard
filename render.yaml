# Render Blueprint: New > Blueprint, pick this repo. Or create a Web Service by hand
# with the same build/start commands.
services:
  - type: web
    name: leadboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
